<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iliketodrink.beer</title>
    <link rel="stylesheet" href="style.css">
</head>
  <style>
  /* Remove default browser spacing */
body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden; /* Prevents scrollbars if the image is slightly off */
}

.fullscreen-img {
    width: 100vw;       /* 100% of the viewport width */
    height: 100vh;      /* 100% of the viewport height */
    object-fit: cover;  /* Ensures the image fills the space without stretching */
    display: block;     /* Removes the small gap at the bottom of the image */
}
    </style>
<body>
    <img src="beer.webp" alt="Background" class="fullscreen-img">
</body>
</html>
